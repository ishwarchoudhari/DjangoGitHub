version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: glamhive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glamhive
      POSTGRES_PASSWORD: glamhive
      POSTGRES_DB: glamhive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: glamhive-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@glamhive.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: